name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The action's default package list ("tools platform-tools") breaks on current
      # SDK repositories because the legacy "tools" package no longer exists.
      # Only install platform-tools here; Gradle auto-downloads the platform and
      # build-tools versions this project needs once licenses are accepted.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Debug verification only: no release signing, no publishing.
      - name: Assemble debug, run unit tests and lint
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          --console=plain --stacktrace

      - name: Upload test, lint and debug APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore
          retention-days: 7
