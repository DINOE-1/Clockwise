name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Signing material for the installable beta APK. Every GitHub-hosted runner generates its own
    # debug keystore, so debug APKs from different runs cannot be installed over each other. The
    # beta is a release build signed with this fixed key instead; when the secrets are missing
    # (forks, or before they are configured) the release steps are skipped.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Only platform-tools are installed here; Gradle auto-downloads the platform
      # and build-tools versions this project needs once licenses are accepted.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug, run unit tests and lint
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          --console=plain --stacktrace

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clockwise-release.jks"

      - name: Assemble signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clockwise-release.jks
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      # Download this artifact and install it on top of an older beta: the signature is the same
      # for every run, so the update succeeds without uninstalling.
      - name: Upload signed beta APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: clockwise-beta
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Public metadata only. The debug APK is deliberately not published: it is signed by a
      # throwaway per-run debug key and would conflict with an installed beta.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore
          retention-days: 7
