name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The published APK must always be signed with the same stable key so users can install every
    # release on top of the previous one. Debug signing is never used: when the secrets are missing
    # the job fails instead of publishing an APK that cannot update an installed build.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Require release signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::KEYSTORE_BASE64 is not configured; refusing to publish an APK that cannot update installed builds."
          exit 1

      - name: Restore release keystore
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clockwise-release.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clockwise-release.jks
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Name APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "Clockwise-${GITHUB_REF_NAME}.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Clockwise-${GITHUB_REF_NAME}.apk"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(
              release create "$GITHUB_REF_NAME"
              --verify-tag
              --title "$GITHUB_REF_NAME"
              --generate-notes
            )
            case "$GITHUB_REF_NAME" in
              *-*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "Clockwise-${GITHUB_REF_NAME}.apk" --clobber
